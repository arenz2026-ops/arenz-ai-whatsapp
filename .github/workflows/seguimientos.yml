# Seguimiento automático ARENZ: cada hora en horario comercial de Lima (9:00–20:00, UTC-5).
# Llama al bot en Render; el bot decide a quién escribir (ver followups.py). Costo 0.
# Requiere el secreto de repositorio CRON_TOKEN, igual al CRON_TOKEN configurado en Render.
name: Seguimientos
on:
  schedule:
    - cron: "17 14-23 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:
jobs:
  seguimientos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ejecutar seguimientos
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          # El plan gratis de Render se duerme: el primer intento lo despierta.
          for intento in 1 2 3; do
            code=$(curl -sS -o respuesta.json -w "%{http_code}" -m 90 -X POST \
              -H "X-Cron-Token: $CRON_TOKEN" https://arenz-ai-whatsapp-prod.onrender.com/tareas/seguimientos) || code=000
            cat respuesta.json 2>/dev/null; echo " (HTTP $code)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          exit 1
