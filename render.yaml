services:
  - type: web
    # Canonical service: this is the host Meta's webhook points at. The former
    # 'arenz-ai-whatsapp' was a second service running the same code with an
    # incomplete environment; it is being retired.
    name: arenz-ai-whatsapp-prod
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      # IA conversacional: encendida por defecto; solo "off" en el panel de Render la apaga (interruptor de emergencia).
      - key: CONVERSACION_IA
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADVISOR_PHONE
        sync: false
      - key: ADVISOR_TEMPLATE
        sync: false
      - key: ADVISOR_TEMPLATE_LANGUAGE
        value: es
      # Fotos de Trello (trello_photos.py): clave y token de solo lectura de la Power-Up "CREENZIA fotos".
      - key: TRELLO_KEY
        sync: false
      - key: TRELLO_TOKEN
        sync: false
