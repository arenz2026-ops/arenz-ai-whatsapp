services:
  - type: web
    # Canonical service: this is the host Meta's webhook points at. The former
    # 'arenz-ai-whatsapp' was a second service running the same code with an
    # incomplete environment; it is being retired.
    name: arenz-ai-whatsapp-prod
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
